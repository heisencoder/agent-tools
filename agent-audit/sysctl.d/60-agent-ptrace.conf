# Installed by agent-tools/agent-audit/install.sh.
#
# Yama ptrace scope 1: a process may ptrace (debug, read or patch the memory
# of) only its own descendants.  This is what stops a tool process run by
# Claude Code from patching its *parent*, the running claude process, to
# switch off its hooks.  agent-run refuses to start sessions if the live
# value is below 1.  See docs/design/background.md, "Users, UIDs,
# capabilities, and Yama".
#
# Ubuntu already ships 1 in 10-ptrace.conf; this file keeps it there even if
# that file is edited.  To run with 2 or 3 instead (also fine for agent-run),
# set it in a file that sorts after this one, e.g. 99-local-ptrace.conf.
kernel.yama.ptrace_scope = 1
