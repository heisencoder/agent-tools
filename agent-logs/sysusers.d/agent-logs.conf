# System users and groups for agent-logd (host only).
# See docs/design/implementation.md, "agent-logd".
#
# agent-logd   runs the receiver and owns /var/log/agent-audit
# agent-audit  may read the store (install-host.sh adds the reader: the
#              administrator who ran it, or --reader USER)
g agent-audit -
u agent-logd  - "Agent audit log daemon" - -
